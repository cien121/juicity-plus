name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Tidy modules
        run: go mod tidy
      - name: Build Linux
        run: |
          go build -o juicity-client ./cmd/client
          go build -o juicity-server ./cmd/server
          ls -lh juicity-*
      - name: Build Android arm64
        run: |
          GOOS=android GOARCH=arm64 go build -o juicity-client-android-arm64 ./cmd/client
          ls -lh juicity-client-android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: juicity-binaries
          path: juicity-*
          retention-days: 7
